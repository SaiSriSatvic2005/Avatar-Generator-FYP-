name: Build Flutter Release APK

on:
  push:
    branches: [ "V8", "main", "master" ]
  workflow_dispatch: # Allows manual one-click trigger in GitHub Actions tab

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Scaffold
        working-directory: mobile_app
        run: |
          # Clean any incomplete android files and generate official scaffold
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=universal_sign_avatar
          
          # Inject Camera, Internet & Media permissions into AndroidManifest.xml
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>
          '''
          c = c.replace('<application', perms + '\n    <application android:usesCleartextTraffic=\"true\"')
          with open(p, 'w') as f:
              f.write(c)
          "
          
          # Set minSdkVersion to 21 (required by webview_flutter & video_player)
          python3 -c "
          bg = 'android/app/build.gradle'
          with open(bg, 'r') as f:
              txt = f.read()
          txt = txt.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          txt = txt.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          with open(bg, 'w') as f:
              f.write(txt)
          "

      - name: Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalSignAvatar-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
