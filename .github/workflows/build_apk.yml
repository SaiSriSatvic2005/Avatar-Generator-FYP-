name: Build Flutter Release APK

on:
  push:
    branches: [ "V8", "main", "master" ]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Allows manual one-click trigger in GitHub Actions tab

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Standalone Release APK
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Build Universal Fat APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalSignAvatar-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
