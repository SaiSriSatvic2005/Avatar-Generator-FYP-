services:
  - type: web
    name: sign-avatar-translator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 webapp.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
