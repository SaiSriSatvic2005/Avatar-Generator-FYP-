<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Video Player &bull; Sign2Avatar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .player-card {
      width: 100%;
      max-width: 820px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .player-header {
      padding: 12px 18px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #3b82f6;
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .badge-dgs {
      background: #f59e0b;
      color: #000;
    }
    .badge-isl {
      background: #10b981;
      color: #fff;
    }
    .video-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .header-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: all 0.2s;
    }
    .header-links a:hover {
      background: #334155;
      color: #ffffff;
    }
    .video-stage {
      position: relative;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 440px;
      max-height: 70vh;
    }
    video {
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .player-controls {
      padding: 12px 18px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-top: 1px solid #1e293b;
    }
    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .ctrl-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .speed-btn {
      padding: 3px 8px;
      font-size: 0.74rem;
    }
    .status-hint {
      font-size: 0.74rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="player-header">
      <div class="title-area">
        <span id="dataset-badge" class="badge">SIGN</span>
        <h1 id="video-title" class="video-title">Sign Language Video</h1>
        <span id="gloss-badge" class="badge" style="background:#334155;">GLOSS</span>
      </div>
      <div class="header-links">
        <a href="index.html#demo">&larr; Back to Portal</a>
      </div>
    </div>
    <div class="video-stage">
      <video id="main-video" autoplay controls loop playsinline></video>
    </div>
    <div class="player-controls">
      <div class="controls-left">
        <button id="btn-toggle-play" class="ctrl-btn">&#9658; Play / Pause</button>
        <button id="btn-restart" class="ctrl-btn">&#8635; Replay</button>
        <button id="btn-loop" class="ctrl-btn active">&infin; Loop: ON</button>
      </div>
      <div class="controls-right">
        <span class="status-hint">Speed:</span>
        <button class="ctrl-btn speed-btn" data-speed="0.5">0.5x</button>
        <button class="ctrl-btn speed-btn" data-speed="0.75">0.75x</button>
        <button class="ctrl-btn speed-btn active" data-speed="1.0">1.0x</button>
        <button class="ctrl-btn speed-btn" data-speed="1.5">1.5x</button>
        <a id="raw-link" href="#" target="_blank" class="ctrl-btn" style="text-decoration:none; margin-left:4px;">Direct MP4 &nearr;</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoSrc = params.get('video') || 'assets/videos/1006_WAS2.mp4';
    const title = params.get('title') || '1006 Was (What)';
    const gloss = params.get('gloss') || 'WAS';
    const dataset = params.get('dataset') || 'DGS';

    document.title = `${title} • Sign2Avatar Player`;
    document.getElementById('video-title').textContent = title;
    document.getElementById('gloss-badge').textContent = gloss;

    const dsBadge = document.getElementById('dataset-badge');
    dsBadge.textContent = dataset;
    if (dataset.toLowerCase().includes('dgs')) {
      dsBadge.className = 'badge badge-dgs';
    } else {
      dsBadge.className = 'badge badge-isl';
    }

    const video = document.getElementById('main-video');
    video.src = videoSrc;
    document.getElementById('raw-link').href = videoSrc;

    // Autoplay execution
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(e => console.log('Autoplay prevented:', e));
    });

    // Play / Pause toggle
    document.getElementById('btn-toggle-play').addEventListener('click', () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });

    // Replay
    document.getElementById('btn-restart').addEventListener('click', () => {
      video.currentTime = 0;
      video.play();
    });

    // Loop toggle
    const loopBtn = document.getElementById('btn-loop');
    loopBtn.addEventListener('click', () => {
      video.loop = !video.loop;
      if (video.loop) {
        loopBtn.textContent = 'Loop: ON';
        loopBtn.classList.add('active');
      } else {
        loopBtn.textContent = 'Loop: OFF';
        loopBtn.classList.remove('active');
      }
    });

    // Speed controls
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const speed = parseFloat(btn.getAttribute('data-speed'));
        video.playbackRate = speed;
      });
    });
  </script>
</body>
</html>
